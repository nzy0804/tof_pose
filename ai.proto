syntax = "proto3";

package ai;
option go_package = "./proto;proto";

service ModelService {
  rpc Infer(InferRequest) returns (InferResponse);
}

enum ResultKind {
  RESULT_KIND_UNSPECIFIED = 0;
  RESULT_KIND_INTERPOLATED = 1;
  RESULT_KIND_CURRENT = 2;
}

message InferImage {
  string frame_id = 1;
  int64 capture_timestamp_ms = 2;
  bytes image_data = 3 [deprecated = true];
  string object_key = 4;
}

message InferResult {
  string frame_id = 1;
  int64 capture_timestamp_ms = 2;
  bytes pseudo_color_image = 3 [deprecated = true];
  bytes skeleton_contour_image = 4 [deprecated = true];
  int32 person_count = 5;
  int32 processing_time_ms = 6;
  ResultKind result_kind = 7;
  int32 input_index = 8;
  int32 output_index = 9;
  string pseudo_color_image_format = 10 [deprecated = true];
  string skeleton_contour_image_format = 11 [deprecated = true];
  string pseudo_color_object_key = 12;
  string skeleton_contour_object_key = 13;
  string person_status = 14;
  string person_distance = 15;
  string action_level = 16;
}

message InferRequest {
  string device_id = 1;
  string batch_id = 2;
  repeated InferImage images = 3;
  int32 batch_size = 4;
}

message InferResponse {
  string device_id = 1;
  string batch_id = 2;
  repeated InferResult results = 3;
  int32 processing_time_ms = 4;
}
